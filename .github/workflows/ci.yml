name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        go: [stable]
        include:
          - os: ubuntu-latest
            go: '1.23'
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: tests
        run: go test -count=1 -v ./...
      - name: tests with cgocheck2
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: GOEXPERIMENT=cgocheck2 go test -count=1 ./...
      - name: constants are up to date
        run: |
          go run ./tools/genconsts
          git diff --exit-code consts.go
      - name: examples
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/" ./examples/...
      - name: hello on the test backend
        run: GOOME_BACKEND=test GOOME_TEST_SCRIPT='screen 800x600 1; 2 click 100,100; 3 click 100,180; 4 key hi; 7 key \e; end 20' "$RUNNER_TEMP/bin/hello"
      - name: ui demo on the test backend
        run: GOOME_BACKEND=test GOOME_TEST_SCRIPT='screen 1280x720 1; 3 click 60,62; 6 click 130,62; 9 click 200,62; 12 click 270,62; 15 click 600,52; end 30' "$RUNNER_TEMP/bin/ui"
      - name: app on the test backend
        run: GOOME_BACKEND=test GOOME_TEST_SCRIPT='screen 1x1 1; 3 resize 700x500; 5 close; end 10' "$RUNNER_TEMP/bin/app"
      - name: offscreen
        run: |
          "$RUNNER_TEMP/bin/offscreen" "$RUNNER_TEMP/off.png" | tee "$RUNNER_TEMP/off.txt"
          grep -q "check 1 volume" "$RUNNER_TEMP/off.txt"
      - name: grab on the test backend
        run: GOOME_BACKEND=test GOOME_TEST_SCRIPT='screen 320x200 1; end 5' "$RUNNER_TEMP/bin/grab" 0 10 10 40 30 "$RUNNER_TEMP/out.ppm" | grep "40x30 px"
